server:
  port: 9100

dlna:
  # Blank = let jUPnP pick the interfaces itself, which is correct on most networks.
  # Set to an interface name (e.g. "eth0") or a comma-separated list of local IPs to pin it.
  network-interface: ${NETWORK_INTERFACE:}
  discovery-timeout: 5000
  discovery-interval: ${DISCOVERY_INTERVAL:60000}
  # Optional fallback for devices that Windows AppContainer isolation hides from local SSDP.
  # Empty by default: with no entries the periodic check does nothing. Configure via
  # DLNA_STATIC_DEVICES_0_UDN / _DESCRIPTOR_URL when you actually need it.
  static-device-check-interval: ${STATIC_DEVICE_CHECK_INTERVAL:30000}
  static-devices: []
  # Seconds a discovered device stays in the list after its last SSDP heartbeat or search
  # response. Live devices keep refreshing their timestamp, so devices that leave the
  # network drop out quickly. Keep this above discovery-interval / 1000.
  remote-device-max-age-seconds: ${REMOTE_DEVICE_MAX_AGE_SECONDS:90}

cors:
  # Comma-separated origins allowed to call the API cross-origin. Only needed for the Vite
  # dev server; in production nginx serves the SPA from the same origin. Never set this to "*".
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

subtitles:
  # Charset for sidecar .srt files that carry no BOM and are not valid UTF-8. Western European
  # is right for an English-language library. The same byte values mean different letters in
  # other Latin variants — 0xC3 is 'A-breve' in ISO-8859-2 but 'A-tilde' in windows-1252 — so set
  # this to ISO-8859-2 for Romanian, Polish, Czech or Hungarian subtitles.
  fallback-charset: ${SUBTITLE_FALLBACK_CHARSET:windows-1252}

tmdb:
  api-read-access-token: ${TMDB_API_READ_ACCESS_TOKEN:}
  image-base-url: https://image.tmdb.org/t/p/w500
  search-type: ${TMDB_SEARCH_TYPE:both}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # Suppress jUPnP's noisy WARN for devices with malformed descriptors
    # (e.g., invalid deviceType like urn:schemas-upnp-org:device:3.0-AMC046002B16D40155)
    org.jupnp.protocol.RetrieveRemoteDescriptors: ERROR
    # Some devices advertise protected descriptors with an invalid HTTP 401 response.
    org.jupnp.util.SpecificationViolationReporter: ERROR
    # Recovery attempts are expected for malformed third-party device descriptors.
    org.jupnp.binding.xml.RecoveringUDA10DeviceDescriptorBinderImpl: ERROR
