# Template for the dlna-hub TMDB credentials.
#
# Copy to k8s/secret.yml (which is gitignored) and fill in real values:
#
#   cp k8s/secret.example.yml k8s/secret.yml
#   $EDITOR k8s/secret.yml
#   kubectl apply -f k8s/secret.yml -n dlna-hub
#
# Never commit the filled-in copy. Get the credentials from
# https://www.themoviedb.org/settings/api
#
# TMDB integration is optional: with no token the backend serves
# /api/tmdb/search as {"available": false} and everything else works.
apiVersion: v1
kind: Secret
metadata:
  name: dlna-hub-secret
  namespace: dlna-hub
type: Opaque
stringData:
  # The only credential the backend actually reads (TmdbService authenticates
  # with a bearer token; see TmdbConfig.isEnabled).
  TMDB_API_READ_ACCESS_TOKEN: "REPLACE_ME"
